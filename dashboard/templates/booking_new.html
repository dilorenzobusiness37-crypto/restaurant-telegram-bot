{% extends "base.html" %}
{% block title %}Nuova prenotazione{% endblock %}
{% block content %}
<h1>Nuova prenotazione</h1>
<p class="muted">Per chi prenota al telefono o di persona.</p>

{% if errors %}
<div class="flash flash-error">
  <ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
</div>
{% endif %}

<form method="post" action="/bookings/new" class="card stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Nome
    <input type="text" name="name" value="{{ values.name }}" required minlength="2" maxlength="50" autocomplete="off">
  </label>
  <label>Telefono <span class="muted small">(facoltativo)</span>
    <input type="tel" name="phone" value="{{ values.phone }}" maxlength="30" autocomplete="off">
  </label>
  <div class="row">
    <label>Persone
      <input type="number" name="people" value="{{ values.people }}" min="1" max="200" required inputmode="numeric">
    </label>
    <label>Data
      <input type="date" name="date" value="{{ values.date }}" required>
    </label>
    <label>Orario
      <input type="time" name="time" value="{{ values.time }}" list="slots" required>
      <datalist id="slots">{% for s in slots %}<option value="{{ s }}">{% endfor %}</datalist>
    </label>
  </div>
  <label>Note <span class="muted small">(facoltativo)</span>
    <textarea name="notes" rows="3" maxlength="300">{{ values.notes }}</textarea>
  </label>
  <div class="actions">
    <button type="submit" class="btn btn-primary">Salva prenotazione</button>
    <a href="/" class="btn btn-ghost">Annulla</a>
  </div>
</form>
{% endblock %}
