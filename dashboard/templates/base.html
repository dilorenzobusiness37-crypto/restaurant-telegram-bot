<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#561a2c">
  <title>{% block title %}Pannello{% endblock %} – {{ restaurant_name }}</title>
  <link rel="preload" href="/static/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block chrome %}
  <header class="masthead on-dark">
    <div class="page masthead-inner">
      <a class="brand" href="/">{{ restaurant_name }}</a>
      <nav class="tabs" aria-label="Sezioni">
        <a href="/" {% if nav == 'bookings' %}aria-current="page"{% endif %}>Oggi</a>
        <a href="/bookings/new" {% if nav == 'new' %}aria-current="page"{% endif %}>Aggiungi</a>
        <a href="/menu" {% if nav == 'menu' %}aria-current="page"{% endif %}>Menù</a>
      </nav>
      <form method="post" action="/logout" class="logout">
        <button type="submit">Esci</button>
      </form>
    </div>
  </header>
  {% endblock %}

  <main class="{% block main_class %}page{% endblock %}">
    {% block flashes %}
      {% for kind, message in flashes %}
        <div class="notice notice-{{ kind }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endblock %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
